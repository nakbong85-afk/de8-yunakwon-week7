# docker compose 가 docker-compose.yaml 과 함께 자동으로 읽는 추가 설정 (작업을 실행하는 worker 에만 적용).
#
# 1) 자격증명(AWS 키)을 코드 · yaml · .env · Airflow DB 어디에도 적지 않기 위해
#    호스트의 AWS CLI 프로필(~/.aws)을 읽기 전용으로 마운트한다.
#    boto3 는 기본 자격증명 체인으로 /home/airflow/.aws/credentials 를 읽는다.
# 2) ./data (git 제외 폴더) 를 /opt/airflow/data 로 마운트해 S3 에서 내려받은 파일이
#    컨테이너를 다시 만들어도 남고, 호스트에서 실행한 s3_download.py 의 결과(project/data/)와 같은 자리가 된다.
# 3) 버킷 이름과 기준 연도는 환경변수로 주입한다 (코드에 하드코딩하지 않음). 키가 아니므로 적어도 된다.
services:
  airflow-worker:
    volumes:
      - ${USERPROFILE:-~}/.aws:/home/airflow/.aws:ro
      - ${AIRFLOW_PROJ_DIR:-.}/data:/opt/airflow/data
    environment:
      WEEK7_BUCKET: de-8-yunakwon
      WEEK7_BASE_YEAR: "2015"
